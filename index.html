  <meta charset="UTF-8" />

  <title>Barry 63</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background-color: #000;
      color: #fff;
    }

    .iframe-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .homebtn {
      position: absolute;
      top: 12px;
      left: -55px;
      z-index: 10;
      padding: 10px 16px;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.5s;
    }

    .homebtn:hover {
      transform: translateX(45px);
      border-radius: 5px;
    }

    .homebtn:active {
      scale: 0.9;
      background-color: #000;
      transition-duration: 0.3s;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <button class="homebtn" onclick="reloadIframe()">Back</button>
    <!-- Load your launcher page here -->
    <iframe id="myIframe" src="phone1.html"></iframe>
  </div>

  <script>
    // Reload iframe button
    function reloadIframe() {
      const iframe = document.getElementById('myIframe');
      const src = iframe.src;
      iframe.src = '';
      setTimeout(() => iframe.src = src, 50);
    }

    // ⚠️ Service worker is intentionally disabled
    // Do NOT register any /sw.js
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, function(err) {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
